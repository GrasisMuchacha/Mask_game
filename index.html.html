<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Маски богов — три в ряд</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#efe3cc;--panel:#c9ad7d;--ink:#2a1d16;--mute:#6b5638;--plate:#1f1510;--carve:#1f1510;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17100c;--panel:#3a281d;--ink:#f1e4c8;--mute:#b39a72}}
:root[data-theme="dark"]{--bg:#17100c;--panel:#3a281d;--ink:#f1e4c8;--mute:#b39a72}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
main{max-width:500px;margin:0 auto;padding:12px 8px 24px}
h1{font:700 24px Cinzel,Georgia,serif;letter-spacing:.04em;margin:4px 0 14px}
.hud{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:8px;margin-bottom:10px}
.hud div{background:var(--panel);border-radius:12px;padding:9px 12px}
.hud small{display:block;color:var(--mute);font-size:12px;margin-bottom:2px}
.hud b{font:700 18px Cinzel,Georgia,serif;white-space:nowrap}
.bar{height:8px;border-radius:6px;background:var(--panel);overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2ab7a9,#f2b82e);transition:width .5s}
.wrap{position:relative}
.stage{perspective:900px;perspective-origin:50% 20%}
.frame{background:linear-gradient(160deg,var(--panel),color-mix(in srgb,var(--panel) 65%,#000));padding:9px;border-radius:18px;transform:rotateX(12deg);transform-origin:50% 100%;box-shadow:0 20px 24px -10px rgba(0,0,0,.55),0 7px 0 color-mix(in srgb,var(--panel) 50%,#000),inset 0 0 0 2px rgba(255,255,255,.18)}
.frame.shake{animation:shk .4s}
@keyframes shk{25%{transform:rotateX(12deg) translate(-5px,2px)}75%{transform:rotateX(12deg) translate(5px,-2px)}}
#board{position:relative;width:100%;aspect-ratio:1;touch-action:none;overflow:hidden;border-radius:10px;background:rgba(0,0,0,.18)}
.t{position:absolute;left:0;top:0;width:calc(100%/var(--n,7));height:calc(100%/var(--n,7));transform:translate(calc(var(--x)*100%),calc(var(--y)*100%));transition:transform .34s cubic-bezier(.3,1.35,.5,1);will-change:transform}
.p{position:absolute;inset:2.5px;border-radius:11px;background:linear-gradient(145deg,var(--p1,#3b2a1f),var(--p2,#140d09));display:grid;place-items:center;box-shadow:inset 0 2px 0 rgba(255,255,255,.14),inset 0 -3px 0 rgba(0,0,0,.55),inset 0 0 0 1.5px color-mix(in srgb,currentColor 45%,transparent),0 3px 0 #0b0604,0 6px 7px rgba(0,0,0,.5);transition:transform .35s ease-in,opacity .35s,filter .35s}
.p svg{width:80%;height:80%;filter:drop-shadow(0 1.5px 0 rgba(0,0,0,.7)) drop-shadow(0 0 2px color-mix(in srgb,currentColor 55%,transparent))}
.k0{--ci:var(--c0,#e4452f);--gi:var(--gl0,#fff3cf)}.k1{--ci:var(--c1,#2fa8d8);--gi:var(--gl1,#fff3cf)}.k2{--ci:var(--c2,#3fb860);--gi:var(--gl2,#fff3cf)}.k3{--ci:var(--c3,#f2b82e);--gi:var(--gl3,#3b2208)}.k4{--ci:var(--c4,#a35be0);--gi:var(--gl4,#fff3cf)}
.t.sel .p{animation:lift .9s ease-in-out infinite}
@keyframes lift{0%,100%{transform:perspective(220px) translateZ(10px)}50%{transform:perspective(220px) translateZ(24px) rotateX(8deg) scale(1.03)}}
.t.pop .p{transform:perspective(260px) rotateY(180deg) scale(.15);opacity:0;filter:brightness(2.2)}
.p.born{animation:born .55s ease-out}
@keyframes born{from{transform:perspective(200px) translateZ(70px) scale(1.4);filter:brightness(2.5)}}
.bn .p::after{content:none}

@keyframes glow{from{opacity:.3}to{opacity:1}}
.p svg.bi{position:absolute;right:1px;bottom:1px;width:50%;height:50%;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.8))}
.c{fill:var(--carve)}.cs{fill:none;stroke:var(--carve);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.ms{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}.r{fill:#ff5a36}
.p svg use,.skin svg use{fill:currentColor}
.fx{position:absolute;pointer-events:none;z-index:5}
.fx.row{background:linear-gradient(90deg,transparent,#fff7c2,#f2b82e,#fff7c2,transparent);animation:bx .55s ease-out forwards}
.fx.col{background:linear-gradient(180deg,transparent,#fff7c2,#f2b82e,#fff7c2,transparent);animation:by .55s ease-out forwards}
.fx.bomb{border-radius:50%;background:radial-gradient(circle,#fff 0,#ffb347 30%,#ff4d2e 55%,transparent 70%);animation:boom .6s ease-out forwards}
@keyframes bx{from{transform:scaleX(0);opacity:1}to{transform:scaleX(1);opacity:0}}
@keyframes by{from{transform:scaleY(0);opacity:1}to{transform:scaleY(1);opacity:0}}
@keyframes boom{from{transform:scale(.1);opacity:1}to{transform:scale(1.2);opacity:0}}
#over{position:absolute;inset:0;background:color-mix(in srgb,var(--bg) 90%,transparent);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;animation:fade .5s ease both;z-index:9}
#over[hidden]{display:none}
#over p{margin:0;font:700 20px/1.4 Cinzel,Georgia,serif}
#over small{font:14px system-ui,sans-serif;color:var(--mute)}
@keyframes fade{from{opacity:0}}
button.main{font:700 15px Cinzel,Georgia,serif;border:0;border-radius:12px;padding:12px 24px;background:var(--ink);color:var(--bg);cursor:pointer}
button.main:focus-visible{outline:3px solid var(--panel);outline-offset:2px}
.say{position:absolute;left:50%;top:42%;font:700 28px Cinzel,Georgia,serif;color:#f2b82e;text-shadow:0 2px 0 #1f1510,0 0 12px #1f1510;pointer-events:none;white-space:nowrap;z-index:8;animation:rise .95s ease-out forwards}
@keyframes rise{from{opacity:0;transform:translate(-50%,12px) scale(.8)}20%{opacity:1}to{opacity:0;transform:translate(-50%,-34px) scale(1.1)}}
.hint{color:var(--mute);font-size:14px;line-height:1.45;margin:18px 2px 0}
.fx.ring{border-radius:50%;border:2px solid currentColor;opacity:0;animation:ring .5s ease-out forwards}
@keyframes ring{from{transform:scale(.4);opacity:.9}to{transform:scale(var(--s,1.5));opacity:0}}
.fx.pts{font:700 14px Cinzel,Georgia,serif;text-align:center;color:#fff;text-shadow:0 1px 3px #000;animation:pt .8s ease-out forwards}
@keyframes pt{from{transform:translateY(8px);opacity:0}25%{opacity:1}to{transform:translateY(-26px);opacity:0}}
.p.land{transform-origin:50% 100%;animation:land .28s ease-out}
@keyframes land{40%{transform:scale(1.06,.9)}}

.top{margin-top:22px}.top h2{font:700 16px Cinzel,Georgia,serif;margin:0 0 8px}.top ol{list-style:none;margin:0;padding:0;display:grid;gap:6px}.top li{display:flex;justify-content:space-between;gap:10px;background:var(--panel);border-radius:10px;padding:8px 12px;font-size:14px}
:root[data-skin="masks"]{--bg:#173824;--bgi:linear-gradient(165deg,#12301f,#2a5e3a 55%,#173f2a);--panel:#3f6b4c;--ink:#eaf5e4;--mute:#a4c8ac}
:root[data-skin="fantasy"]{--bg:#1c1033;--bgi:linear-gradient(165deg,#1c1033,#3a1f5c 55%,#14253f);--panel:#3b2766;--ink:#f1e9ff;--mute:#bba9e3;--p1:#3a2766;--p2:#1a0f33;--carve:#26184a}
:root[data-skin="flowers"]{--bg:#ffe9f0;--bgi:linear-gradient(165deg,#ffe3ec,#fff3d6 55%,#d9f2d0);--panel:#f3b8cb;--ink:#4a2338;--mute:#8d5c70;--p1:#356b45;--p2:#1b4a2c;--carve:#1f5232}
:root[data-skin="space"]{--bg:#070b22;--bgi:radial-gradient(1.5px 1.5px at 18% 28%,#fff,transparent),radial-gradient(1px 1px at 72% 18%,#fff,transparent),radial-gradient(1.5px 1.5px at 42% 78%,#fff,transparent),radial-gradient(1px 1px at 86% 62%,#fff,transparent),radial-gradient(1px 1px at 8% 66%,#fff,transparent),linear-gradient(170deg,#050818,#101a44 60%,#2a1450);--panel:#1b2456;--ink:#e8ecff;--mute:#9eaadb;--p1:#222d63;--p2:#0a0e2b;--carve:#111a45}
body{background:var(--bgi,var(--bg));background-attachment:fixed}
.hd{display:flex;justify-content:space-between;align-items:center}
.mini{font:600 13px Cinzel,Georgia,serif;border:0;border-radius:10px;padding:8px 14px;background:var(--panel);color:var(--ink);cursor:pointer}
.em{font-size:clamp(18px,7vw,30px);line-height:1;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))}
#menu{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:24px;background:var(--bgi,var(--bg));background-attachment:fixed;animation:fade .35s ease both}
#menu[hidden],.mbox[hidden]{display:none}
.mbox{display:grid;gap:12px;width:min(320px,100%);text-align:center}
.mt{font:700 30px Cinzel,Georgia,serif;margin:0 0 10px}
button.main.alt{background:var(--panel);color:var(--ink)}
#skinList{display:grid;gap:10px}
.skin{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;font:600 15px Cinzel,Georgia,serif;color:var(--ink);background:var(--panel);border:2px solid transparent;border-radius:14px;padding:12px;cursor:pointer}
.skin.on{border-color:#f2b82e}
.skin span{font-size:20px;display:flex;gap:3px;align-items:center}.skin svg{width:26px;height:26px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--panel);border-radius:14px;padding:10px 12px;font:600 15px Cinzel,Georgia,serif}
button.sw{min-width:90px;padding:8px 14px}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);z-index:40;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font:700 14px Cinzel,Georgia,serif;white-space:nowrap;pointer-events:none;animation:toast 2.6s ease forwards}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-14px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-8px)}}
#achList{display:grid;gap:8px;max-height:55vh;overflow:auto;text-align:left}
.cnt{margin:0;color:var(--mute);font-size:13px;text-align:center}
.ach{background:var(--panel);border-radius:12px;padding:9px 12px;opacity:.55;display:grid;gap:2px}
.ach.on{opacity:1;box-shadow:inset 3px 0 0 #f2b82e}
.ach b{font:700 14px Cinzel,Georgia,serif}.ach small{color:var(--mute);font-size:12px}
.t{color:var(--ci);--gl:var(--gi);--carve:color-mix(in srgb,var(--ci) 68%,#000)}
#board{--n:7;background:conic-gradient(rgba(0,0,0,.3) 25%,rgba(0,0,0,.14) 0 50%,rgba(0,0,0,.3) 0 75%,rgba(0,0,0,.14) 0) 0 0/calc(200%/var(--n)) calc(200%/var(--n))}
.frame{background:linear-gradient(160deg,#8a7650,#4d4029);padding:9px;box-shadow:0 20px 24px -10px rgba(0,0,0,.6),0 7px 0 #2a2212,inset 0 0 0 3px #e0b04c,inset 0 0 0 5px #5c4520}
.p{inset:1px;border-radius:0;background:none;box-shadow:none}
.p svg{width:100%;height:100%;filter:drop-shadow(0 2px 2px rgba(0,0,0,.5))}
.bn .p>svg:first-child{--gc:#f2b82e;animation:bglow 1s ease-in-out infinite alternate}
.b-bomb .p>svg:first-child{--gc:#ff5a36}
.b-color .p>svg:first-child{--gc:#b98cff}
@keyframes bglow{from{filter:drop-shadow(0 0 1px var(--gc))}to{filter:drop-shadow(0 0 7px var(--gc)) drop-shadow(0 0 2px var(--gc))}}
.hud div{box-shadow:inset 0 0 0 2px #c99a3c}
#score{font-size:15px}
.bst{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.bst button{font:600 13px Cinzel,Georgia,serif;color:var(--ink);background:var(--panel);border:0;border-radius:12px;padding:10px 6px;box-shadow:inset 0 0 0 2px #c99a3c;cursor:pointer;display:grid;gap:2px;justify-items:center}
.bst button.on{background:#f2b82e;color:#2a1d16}.bst button:disabled{opacity:.4}
.bst i{font:700 15px Cinzel,Georgia,serif}
.slab{position:absolute;background:linear-gradient(145deg,#c9c1ac,#8c8470);box-shadow:inset 0 0 0 2px #e6dfc9,inset 0 0 0 4px #6b6450,inset 0 0 10px rgba(0,0,0,.4)}
.slab.crack{animation:crack .5s ease-out forwards}
@keyframes crack{30%{transform:scale(1.12) rotate(2deg);filter:brightness(1.4)}to{transform:scale(.6) rotate(-8deg);opacity:0}}
.t.hint .p{animation:hintp 1s ease-in-out infinite}
@keyframes hintp{50%{transform:scale(.86)}}
.fx.spk{width:5px;height:5px;margin:-2.5px;border-radius:50%;background:#ffe08a;box-shadow:0 0 6px #f2b82e;opacity:0;animation:spk .55s ease-out forwards}
@keyframes spk{from{transform:translate(0,0) scale(1);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
#tut{position:absolute;inset:0;background:color-mix(in srgb,var(--bg) 92%,transparent);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px;z-index:9;animation:fade .5s ease both}
#tut[hidden]{display:none}#tut p{margin:0;font:600 16px/1.5 system-ui,sans-serif}
#dayBox{display:grid;gap:8px;text-align:left}
#mapList{display:grid;gap:8px;max-height:55vh;overflow:auto;justify-items:center;padding:4px}
.node{display:flex;align-items:center;gap:10px;width:170px;background:var(--panel);border-radius:14px;padding:8px 14px;opacity:.5;transform:translateX(var(--sx))}
.node b{font:700 18px Cinzel,Georgia,serif}.node small{color:var(--mute);font-size:12px}
.node.done{opacity:.85}.node.cur{opacity:1;box-shadow:inset 0 0 0 2px #f2b82e}.node.boss{box-shadow:inset 0 0 0 2px #f2b82e,0 0 12px #f2b82e55}
#splash{position:fixed;inset:0;z-index:50;display:grid;place-items:center;align-content:center;gap:16px;background:var(--bgi,var(--bg));background-attachment:fixed;animation:out .5s ease .7s forwards}
@keyframes out{to{opacity:0;visibility:hidden}}
.sg{width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,#f2d27a,#c99a3c);box-shadow:0 0 24px #f2b82e;animation:pl2 .9s ease-in-out infinite alternate}
@keyframes pl2{to{transform:rotate(45deg) scale(.85)}}
@media (prefers-reduced-motion:reduce){.t{transition-duration:.01s}.p,#over,.frame.shake,.p.born,.bn .p::after,.t.sel .p{transition:none;animation:none}.fx,.say{animation-duration:.01s}}
</style>
</head>

<script>
const tg=window.Telegram&&window.Telegram.WebApp;
if(tg){try{tg.ready();tg.expand()}catch(e){}}
const N=7,K=5,$=id=>document.getElementById(id),sleep=ms=>new Promise(r=>setTimeout(r,ms)),rnd=()=>Math.floor(Math.random()*K);
const NAMES=['Ягуар','Орёл','Змея','Солнце','Череп'],BI={row:'↔',col:'↕',bomb:'✹',color:'✦'};
const board=$('board');
let g,ls,moves,target,lvl=1,sel=null,busy=true,won=false,bestL=1,down=null;
try{bestL=+localStorage.getItem('azlvl')||1}catch(e){}
try{lvl=+localStorage.getItem('azcur')||1}catch(e){}
const R=i=>i/N|0,C=i=>i%N,T=i=>g[R(i)][C(i)];
const goal=L=>Math.round((800+(L-1)*300+(L-1)**2*15)/50)*50;
const movesFor=L=>Math.min(60,25+3*Math.floor(L/3));
const put=(t,r,c)=>{t.el.style.setProperty('--x',c);t.el.style.setProperty('--y',r)};
function rec(l){if(l>bestL){bestL=l;try{localStorage.setItem('azlvl',l)}catch(e){}}}
function hud(){$('lvl').textContent=lvl;$('score').textContent=objText();$('moves').textContent=moves;$('bar').style.width=objPct()+'%'}
function build(t,r,c,fromY,delay=0){
  const el=document.createElement('div');
  el.className='t k'+t.t;
  el.innerHTML=`<div class="p">${glyph(t.t)}</div>`;
  t.el=el;
  el.style.transition='none';put(t,fromY,c);board.appendChild(el);el.offsetWidth;
  el.style.transition='';el.style.transitionDelay=delay+'ms';put(t,r,c);
  if(delay)setTimeout(()=>{el.style.transitionDelay=''},delay+600);
}
function setBonus(t,b){
  t.b=b;t.el.classList.add('bn','b-'+b);
  const p=t.el.firstChild;p.insertAdjacentHTML('beforeend',`<svg class="bi" viewBox="0 0 24 24" role="img" aria-label="бонус"><use href="#bi-${b}"/></svg>`);
  p.classList.add('born');setTimeout(()=>p.classList.remove('born'),650);
}
function find(){
  const s=new Set(),runs=[],v=(r,c)=>g[r][c]?g[r][c].t:-1;
  for(let d=0;d<2;d++)for(let a=0;a<N;a++){
    let b=0;
    for(let k=1;k<=N;k++){
      const cur=k<N?(d?v(k,a):v(a,k)):-2,prev=d?v(b,a):v(a,b);
      if(cur!==prev){
        if(k-b>=3&&prev>=0){const cells=[];for(let x=b;x<k;x++)cells.push(d?x*N+a:a*N+x);cells.forEach(i=>s.add(i));runs.push({cells,dir:d?'v':'h'})}
        b=k;
      }
    }
  }
  return{s,runs};
}
function zap(i,b){
  const r=R(i),c=C(i),o=[];
  for(let y=0;y<N;y++)for(let x=0;x<N;x++)
    if(b==='row'?y===r:b==='col'?x===c:b==='color'?(g[y][x]&&g[y][x].t===g[r][c].t):Math.abs(y-r)<=1&&Math.abs(x-c)<=1)o.push(y*N+x);
  return o;
}
function fx(i,b){sfx.boom();hap('m');
  if(b==='color'){ring(i,3);zap(i,b).forEach(j=>ring(j,1.7,(Math.abs(R(j)-R(i))+Math.abs(C(j)-C(i)))*45));return}
  const e=document.createElement('div'),r=R(i),c=C(i),u=100/N;e.className='fx '+b;
  e.style.cssText=b==='row'?`left:0;width:100%;top:${r*u}%;height:${u}%`:b==='col'?`top:0;height:100%;left:${c*u}%;width:${u}%`:`left:${(c-1)*u}%;top:${(r-1)*u}%;width:${3*u}%;height:${3*u}%`;
  board.appendChild(e);setTimeout(()=>e.remove(),700);
  if(b==='bomb'){const f=document.querySelector('.frame');f.classList.remove('shake');void f.offsetWidth;f.classList.add('shake')}
}
function ring(i,s,d=0){
  const e=document.createElement('div'),u=100/N,t=T(i);
  e.className='fx ring';
  e.style.cssText=`left:${C(i)*u}%;top:${R(i)*u}%;width:${u}%;height:${u}%;--s:${s};animation-delay:${d}ms;color:${t?SK[skin].c[t.t]:'#fff'}`;
  board.appendChild(e);setTimeout(()=>e.remove(),d+700);
}
function pts(txt,i){const e=document.createElement('div'),u=100/N;e.className='fx pts';e.textContent=txt;e.style.cssText=`left:${C(i)*u}%;top:${R(i)*u}%;width:${u}%`;board.appendChild(e);setTimeout(()=>e.remove(),850)}
const SK={masks:{n:'Маски богов',id:'m',nm:NAMES,c:['#e4452f','#2fa8d8','#3fb860','#f2b82e','#a35be0']},fantasy:{n:'Фэнтези',id:'fa',nm:['Дракон','Маг','Меч','Замок','Кристалл'],c:['#ff7a3d','#8f9bff','#b8c4d0','#f2b82e','#d070ff']},flowers:{n:'Цветы',id:'fl',nm:['Сакура','Подсолнух','Тюльпан','Лилия','Ромашка'],c:['#ff8fb1','#ffc83d','#ff5a5f','#b98cff','#fff1d6']},space:{n:'Космос',id:'sp',nm:['Планета','Луна','Звезда','Ракета','Комета'],c:['#ff9a5c','#e8eaff','#ffd84d','#ff5d73','#5ee0ff']}};
let skin='masks',started=false,snd=true,ac=null,mus=null;
try{snd=localStorage.getItem('azsnd')!=='0';skin=localStorage.getItem('azskin')||'masks'}catch(e){}
if(!SK[skin])skin='masks';
function lum(h){const n=parseInt(h.slice(1),16);return(.299*(n>>16)+.587*(n>>8&255)+.114*(n&255))/255}
const glyph=k=>`<svg viewBox="0 0 48 48" role="img" aria-label="${SK[skin].nm[k]}"><use href="#gem${k}"/><use href="#${SK[skin].id}${k}" x="10" y="10" width="28" height="28" style="color:var(--gl)"/></svg>`;
function reskin(){if(!g)return;for(const row of g)for(const t of row){const o=t&&t.el&&t.el.querySelector('svg,.em');if(o)o.outerHTML=glyph(t.t)}}
function drawSkins(){$('skinList').innerHTML=Object.entries(SK).map(([k,v])=>`<button class="skin${k===skin?' on':''}" data-skin="${k}"><b>${v.n}</b><span>${[0,1,2,3,4].map(i=>`<svg viewBox="0 0 48 48" style="color:${v.c[i]};--carve:color-mix(in srgb,${v.c[i]} 68%,#000)"><use href="#gem${i}"/><use href="#${v.id}${i}" x="10" y="10" width="28" height="28" style="color:${lum(v.c[i])>.6?'#3b2208':'#fff3cf'}"/></svg>`).join('')}</span></button>`).join('')}
function setSkin(k){skin=k;document.documentElement.dataset.skin=k;SK[k].c.forEach((v,i)=>{const s=document.documentElement.style;s.setProperty('--c'+i,v);s.setProperty('--gl'+i,lum(v)>.6?'#3b2208':'#fff3cf')});seen.add(k);try{localStorage.setItem('azskins',JSON.stringify([...seen]))}catch(e){}if(seen.size>=Object.keys(SK).length)unlockA('skins');$('ttl').textContent=SK[k].n;try{localStorage.setItem('azskin',k)}catch(e){}drawSkins();reskin()}
const AC=window.AudioContext||window.webkitAudioContext,PEN=[262,294,330,392,440,523,587,659];
let master;
function unlock(){
  try{
    if(navigator.audioSession)navigator.audioSession.type='playback';
    if(!ac){
      ac=new AC();const cp=ac.createDynamicsCompressor();master=ac.createGain();master.gain.value=1.6;master.connect(cp);cp.connect(ac.destination);
      const s=ac.createBufferSource();s.buffer=ac.createBuffer(1,1,22050);s.connect(ac.destination);s.start(0);
    }
    return ac.resume().then(()=>ac.state==='running',()=>false);
  }catch(e){return Promise.resolve(false)}
}
['pointerdown','touchend','click'].forEach(ev=>document.addEventListener(ev,()=>{if(snd&&AC&&(!ac||ac.state!=='running'))unlock()},{passive:true}));
function tone(f,d=.12,type='sine',v=.06,at=0,slide=0){
  if(!snd||!AC)return;
  try{
    if(!ac||ac.state!=='running'){unlock().then(ok=>{if(ok)tone(f,d,type,v,at,slide)});return}
    const t=ac.currentTime+at,o=ac.createOscillator(),gn=ac.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(f*slide,t+d);
    gn.gain.setValueAtTime(Math.min(v*3,.5),t);gn.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(gn);gn.connect(master||ac.destination);o.start(t);o.stop(t+d);

  return null;
}
board.addEventListener('pointerdown',e=>{idle=Date.now();clearHint();if(busy)return;const i=idx(e);if(i!==null)down={i,x:e.clientX,y:e.clientY}});
addEventListener('pointerup',e=>{
  if(!down)return;const d=down;down=null;idle=Date.now();clearHint();if(busy)return;if(hammer){hammer=false;$('bH').classList.remove('on');useB('h');hammerHit(d.i);return}
  const dx=e.clientX-d.x,dy=e.clientY-d.y;
  if(Math.max(Math.abs(dx),Math.abs(dy))>18){
    const r=R(d.i),c=C(d.i),v=Math.abs(dy)>Math.abs(dx);
    const nr=r+(v?Math.sign(dy):0),nc=c+(v?0:Math.sign(dx));
    if(nr>=0&&nr<N&&nc>=0&&nc<N)attempt(d.i,nr*N+nc);
  }else tap(d.i);
});
addEventListener('pointercancel',()=>{down=null});
$('again').addEventListener('click',()=>{if(won)lvl++;init()});
initLb();
</script>
</body>
